# Q5b on the dev model: structure of the activation-selected residual at EQUAL bit budget.
# csr: 0.5% sparse entries (fixed-width positions, int8) — the Q5 representation.
# columns: dense int8 residual on the input columns with the largest Σ_r E[x_j^2]·R_rj² (one fp16 scale per
#   column), as many columns as the CSR budget of the same fraction pays for; _cols0.75 / _cols0.5 spend that
#   share of it on columns and the rest on a CSR tail. Runtime motivation: docs/benchmarks.md K5 (CSR pass ~11 ms/step
#   on Qwen3-8B). rotation_groups: the runtime form (shared input rotation of q/k/v and gate/up).
name: q5b_residual_structure_qwen3_0.6b
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
rotation_groups: true
eval:
  seq_len: 2048
  max_tokens: 32768
  kl_sequences: 16
codecs:
  - {kind: affine, bits: 4}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.005}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.005, residual_structure: columns}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.005, residual_structure: columns, residual_column_share: 0.75}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.005, residual_structure: columns, residual_column_share: 0.5}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, residual_fraction: 0.005}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, residual_fraction: 0.005, residual_structure: columns}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, residual_fraction: 0.005, residual_structure: columns, residual_column_share: 0.5}
