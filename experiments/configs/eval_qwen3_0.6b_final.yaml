# suc eval, dev model, the final SUC1 files on the laptop (Apple M3, 16 GB): the core suite (experiments/eval/
# suite_core.json: 20 QA prompts + 20 short graded items) answered greedily by the C++ runtime (4-bpp and 3.5-bpp
# files) and by the Python runtime (4-bpp file), each graded automatically. No reference comparison by default; to
# compare with BF16 add `- {name: bf16, kind: bf16}` to systems and set `reference: bf16` (teacher-forced KL / top-1 and
# answer / output agreement per case are then reported).
#   HF_HUB_OFFLINE=1 .venv/bin/suc eval experiments/configs/eval_qwen3_0.6b_final.yaml
name: eval_qwen3_0.6b_final
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
suite: experiments/eval/suite_core.json
systems:
  - {name: suc_cpp, kind: suc1_cpp, file: ~/suc-local/compress/compress_qwen3_0.6b_final/container/model.suc1}
  - {name: suc_cpp_3bpp, kind: suc1_cpp, file: ~/suc-local/compress/compress_qwen3_0.6b_final_3bpp/container/model.suc1}
  - {name: suc_python, kind: suc1_python, file: ~/suc-local/compress/compress_qwen3_0.6b_final/container/model.suc1}
reference: null
think_reply_reserve: 256
teacher_forced_positions: 128
compare_to: null
