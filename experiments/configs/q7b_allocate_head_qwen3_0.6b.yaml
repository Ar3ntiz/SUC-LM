# Phase 7 / Q7b on the dev model (code-path check of q7b_allocate_head_qwen3_8b). Qwen3-0.6B has TIED
# embeddings, so only model.embed_tokens.weight (which is also the LM head) becomes an allocation
# candidate; there is no separate lm_head. Its Fisher includes both the lookup (sparse) and the head
# (dense) gradient. Budgets are average bpw over block linears + embedding (~all parameters).
name: q7b_allocate_head_qwen3_0.6b
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
eval:
  seq_len: 2048
  max_tokens: 32768
  kl_sequences: 16
candidates:                                   # Q5 lesson: every codebook candidate carries activation-selected residuals
  - {kind: vq, k: 256, block_size: 4, residual_fraction: 0.005}                     # ~2.2 bpw
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.001}   # ~3.1
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, residual_fraction: 0.005}   # ~3.2
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, residual_fraction: 0.005}   # ~4.2
  - {kind: affine, bits: 4}                                                         # 4.5
  - {kind: bf16}                                                                    # 16
head_candidates:                              # tied embed / LM head (vocab 151936 x 1024)
  - {kind: affine, bits: 4}
  - {kind: affine, bits: 6}
  - {kind: affine, bits: 8}
  - {kind: bf16}
budgets_bpp: [3.0, 3.5, 4.0, 4.25]
uniform: [additive_m3_k256_g8_rot+res0.005_activation, additive_m4_k256_g8_rot+res0.005_activation, affine_b4_g64]
uniform_head: affine_b4_g64
fisher_sequences: 32
fisher_micro_batch: 2
