# R3 on the dev model: residual-stream rotation folded into the weights (suc.models.rotation_folding), q/k/v,
# gate/up and the embedding encoded WITHOUT an input rotation (their input is already the rotated stream); o_proj /
# down_proj keep an online input rotation (foldv: o_proj's is replaced by a per-head Hadamard folded into v_proj).
# Same codecs / residuals / seeds as R1 (r1_rotation_sides_qwen3_0.6b) so the rows pair with its two-sided and
# one-sided rows. Activation statistics are re-recorded in the folded basis on the calibration partition.
name: r3_rotation_folding_qwen3_0.6b
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
eval:
  seq_len: 2048
  max_tokens: 32768
  kl_sequences: 16
rotation_groups: true
codecs:
  - {kind: bf16, fold_rotation: true}
  - {kind: vq, k: 256, block_size: 4, fold_rotation: true, residual_fraction: 0.005}
  - {kind: vq, k: 256, block_size: 4, rotate_out: false, fold_rotation: true, residual_fraction: 0.005}
  - {kind: vq, k: 256, block_size: 4, rotate_out: false, fold_rotation: true, fold_v_heads: true, residual_fraction: 0.005}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, rotate_out: false, fold_rotation: true, residual_fraction: 0.005}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, rotate_out: false, fold_rotation: true, fold_v_heads: true, residual_fraction: 0.005}
