# suc perf, dev model on the laptop (Apple M3, 16 GB): MLX 4-bit, BF16, the final 4-bpp SUC1 file through the C++
# runtime and the Python runtime, in one session, sequentially (laptop otherwise idle). Prompt = the fixed Italian
# public-domain text of ds4-bench (experiments/perf/promessi_sposi_head.txt). Batch > 1 only for the mlx-lm systems.
#   HF_HUB_OFFLINE=1 .venv/bin/suc perf experiments/configs/perf_qwen3_0.6b_final.yaml
name: perf_qwen3_0.6b_final
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
systems:
  - {name: mlx_q4, kind: mlx_affine, bits: 4, group_size: 64}
  - {name: bf16, kind: bf16}
  - {name: suc_cpp, kind: suc1_cpp, file: ~/suc-local/compress/compress_qwen3_0.6b_final/container/model.suc1}
  - {name: suc_python, kind: suc1_python, file: ~/suc-local/compress/compress_qwen3_0.6b_final/container/model.suc1}
reference: mlx_q4
prompt_file: experiments/perf/promessi_sposi_head.txt
contexts: [128, 512, 2048, 8192]
batch_sizes: [1, 4]
gen_tokens: 128
warmup: 1
repeats: 3
mlx_decode: pipelined
compare_to: null
