# suc compress, post-project model zai-org/GLM-5.3-Flash (model_type glm5_next: 45 layers = 34 KDA linear attention +
# 11 NoPE MLA with a k-pool DSA indexer, 4-stream mHC, layers 0-2 dense MLP, layers 3-44 MoE with 288 routed experts
# top-8 + shared expert; MTP layer 45 and the vision tower dropped; docs/arch/glm5_next.md).
#
# Source (D8 amended): the official FP8 checkpoint (E4M3 weights x F32 128 x 128 block multipliers `weight_scale_inv`)
# for experts / shared experts / dense MLP / MLA q_a, q_b, kv_a, o; dequantized at load time to BF16 exactly as the
# reference implementations do (float32 product rounded once; suc.io.quantized_source "fp8_block_f32"). Every PPL / KL
# reference is that dequantized checkpoint. KDA projections, kv_b, the indexer and the router are BF16 in the source.
#
# Size (owner decision 2026-10-03): routed experts at 3.0 bpw on average (role_budgets: their own greedy pass, 304.4 B
# params -> 114.2 GB); every other allocated tensor (KDA q/k/v/o, MLA q_a/q_b/kv_a/o, dense MLP, shared experts: 7.2 B
# params) at 4.5 bpw on average (4.0 GB); fixed part ~1.7 GB (embedding + LM head affine 4-bit g64, kept BF16/F32
# tensors: kv_b, indexer, router, KDA gate factors / convs / A_log / dt_bias, mHC, norms). Predicted file ~120 GB,
# above the 111 GB runtime budget of the 128 GB Mac Studio: preflight.expert_streaming accepts it because the
# non-expert weights (~5.7 GB) + KV at 32k tokens (0.7 GB incl. the KDA state) + 2 GB activations leave a ~103 GB
# expert cache (~90 % of the routed experts); the least-used experts are read from SSD by suc.runtime.expert_streaming
# (pinned hot set from the calibration routing counts: run_dir/container/hot_experts.json).
#
# Allocation: Fisher-guided greedy, allocation_unit "expert" (every routed-expert tensor its own unit, one pooled
# codebook fit per (layer, projection) stack and codec): the LEAST sensitive experts go below 3 bits (VQ G=4, ~2.2 bpp),
# the others to additive M=3 (~3.2) or VQ G=2 (~4.2). Other tensors only get >= 4-bit candidates (candidate_roles);
# the BF16-in-source KDA projections compete for affine 8-bit / BF16 there (doc §6).
#
# Indexer note: at PPL windows of 4096 tokens each DSA layer has 1024 complete k-pools, so the top-512 pool selection
# is exercised; calibration / Fisher (512 tokens, 128 pools) never select (the indexer stays BF16).
#
# Studio (after the download): raise the GPU wired limit for the runtime (sudo sysctl iogpu.wired_limit_mb=116000), then
#   HF_HUB_OFFLINE=1 nohup .venv/bin/suc compress experiments/configs/compress_glm5.3_flash.yaml > logs/compress_glm53_flash.log 2>&1 &
name: compress_glm5.3_flash
seed: 12345
output_dir: experiments/results
model:
  id: zai-org/GLM-5.3-Flash
  revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
  role: target
calibration:
  seq_len: 512
  n_calibration: 512
  n_validation: 128
  n_ood: 64
  mix: {natural: 0.35, code: 0.25, math: 0.2, instruction: 0.2}
  micro_batch: 8
plan:
  mode: greedy
  budget_bpw: 4.5                          # every allocated tensor outside role_budgets
  role_budgets:
    - {roles: [expert_gate, expert_up, expert_down], budget_bpw: 3.0}
  allocation_unit: expert
  candidates:
    # routed experts (one pooled codebook per (layer, projection) stack and codec; one-sided input rotation)
    - {kind: vq, k: 256, block_size: 4, rotate_out: false, residual_fraction: 0.005, residual_structure: columns,
       codebook_scope: expert_stack}                                                                       # ~2.2 bpp
    - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, rotate_out: false, residual_fraction: 0.005,
       residual_structure: columns, codebook_scope: expert_stack}                                          # ~3.2 bpp
    - {kind: vq, k: 256, block_size: 2, rotate_out: false, residual_fraction: 0.005, residual_structure: columns,
       codebook_scope: expert_stack}                                                                       # ~4.2 bpp
    # KDA, MLA, dense MLP and shared experts: per-tensor codebooks
    - {kind: vq, k: 256, block_size: 2, rotate_out: false, residual_fraction: 0.005, residual_structure: columns}  # ~4.2
    - {kind: affine, bits: 8}                                                                                # 8.5
    - {kind: bf16}                                                                                           # 16
  candidate_roles:
    vq_k256_g4_rot1s_xs+res0.005_activation_cols: [expert_gate, expert_up, expert_down]
    additive_m3_k256_g8_rot1s_xs+res0.005_activation_cols: [expert_gate, expert_up, expert_down]
    vq_k256_g2_rot1s_xs+res0.005_activation_cols: [expert_gate, expert_up, expert_down]
    vq_k256_g2_rot1s+res0.005_activation_cols: [kda_q, kda_k, kda_v, kda_o, attn_q_a, attn_q_b, attn_kv_a, attn_o,
                                                mlp_gate, mlp_up, mlp_down, shared_expert_gate, shared_expert_up,
                                                shared_expert_down]
    affine_b8_g64: [kda_q, kda_k, kda_v, kda_o, attn_q_a, attn_q_b, attn_kv_a, attn_o, mlp_gate, mlp_up, mlp_down,
                    shared_expert_gate, shared_expert_up, shared_expert_down]
    bf16: [kda_q, kda_k, kda_v, kda_o, attn_q_a, attn_q_b, attn_kv_a, attn_o, mlp_gate, mlp_up, mlp_down,
           shared_expert_gate, shared_expert_up, shared_expert_down]
  embedding_codec: {kind: affine, bits: 4}
  fisher_sequences: 32
  fisher_micro_batch: 2
eval:
  seq_len: 4096
  max_tokens: null
  kl_sequences: 16
finetune: null
rotation_groups: true
verify_tensors: 16
preflight:
  runtime_budget_bytes: 111000000000      # 111 GB
  runtime_context: 32768
  runtime_activation_bytes: 2000000000
  expert_streaming: true                  # the ~120 GB file runs with the routed experts streamed from SSD
