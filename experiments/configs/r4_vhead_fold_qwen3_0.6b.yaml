# R4 on the dev model: per-head Hadamard folded into v_proj rows / o_proj columns only (no residual-stream folding,
# which R3 showed to break Qwen3's readers: massive activations), one-sided rotations. o_proj is then encoded
# WITHOUT an input rotation; q/k/v, gate/up and down_proj keep theirs. Pairs with the one-sided rows of R1
# (same codecs, residuals, seeds).
name: r4_vhead_fold_qwen3_0.6b
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  role: dev
eval:
  seq_len: 2048
  max_tokens: 32768
  kl_sequences: 16
rotation_groups: true
codecs:
  - {kind: vq, k: 256, block_size: 4, rotate_out: false, fold_v_heads: true, residual_fraction: 0.005}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 3, rotate_out: false, fold_v_heads: true, residual_fraction: 0.005}
