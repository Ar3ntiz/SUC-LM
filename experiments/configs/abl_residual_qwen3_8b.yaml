# Mandatory ablations, Qwen3-8B — part 3: residuals. SUC uses 0.5% activation-selected (E[x_j^2]·R²) int8 residuals
# in the column structure. Rows: none / magnitude-selected columns (same bits, no calibration statistics: also the
# "semantic sensitivity" ablation of the residual selection) / activation-selected CSR (same bits, Q5 structure).
# The CSR row is also the untuned pair of abl_finetune_qwen3_8b (same encoding and seed).
# Studio: ≈ 45 min (reference 6 + 3 × (encode ≈ 7 + evaluate 6)).
name: abl_residual_qwen3_8b
seed: 12345
output_dir: experiments/results
model:
  id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  role: target
eval:
  seq_len: 2048
  max_tokens: null          # full WikiText-2 test split (final-test set, never tuned on)
  kl_sequences: 16          # held-out validation sequences of the Phase 2 corpus
rotation_groups: true       # runtime form: shared input rotation of q/k/v and gate/up
embedding_codec: {kind: affine, bits: 4}   # embedding + untied LM head fixed at affine 4-bit g64 in every row
codecs:
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, rotate_out: false}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, rotate_out: false, residual_fraction: 0.005, residual_structure: columns, residual_selection: magnitude}
  - {kind: additive, k: 256, block_size: 8, num_codebooks: 4, rotate_out: false, residual_fraction: 0.005}
