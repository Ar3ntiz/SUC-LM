plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'local.sucstudio.android'
    compileSdk 34
    defaultConfig { applicationId 'local.sucstudio.android'; minSdk 26; targetSdk 34; versionCode 5; versionName '0.1.4'; testInstrumentationRunner 'local.sucstudio.android.SmokeInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    kotlinOptions { jvmTarget = '11' }
    if (System.getenv('SUC_ANDROID_KEYSTORE')) {
        signingConfigs { release {
            storeFile file(System.getenv('SUC_ANDROID_KEYSTORE'))
            storePassword System.getenv('SUC_ANDROID_STORE_PASSWORD')
            keyAlias System.getenv('SUC_ANDROID_KEY_ALIAS')
            keyPassword System.getenv('SUC_ANDROID_KEY_PASSWORD')
        } }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('SUC_ANDROID_KEYSTORE')) signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0'; implementation 'org.apache.poi:poi-scratchpad:5.2.3'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20180813' }
