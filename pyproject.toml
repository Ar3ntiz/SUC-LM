[project]
name = "suc"
version = "0.0.1"
description = "Semantic Universal Compression — research prototype for codebook-compressed LLM inference on Apple Silicon"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx>=0.29",
    "mlx-lm>=0.28",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.34",
    "pyarrow>=17",
]

[project.scripts]
suc = "suc.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs a downloaded Hugging Face model (slow, network on first run)",
]
addopts = "-m 'not model'"
